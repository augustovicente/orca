name: Whitelabel Windows Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (branch or SHA) to build
        required: false
        default: whitelabel/accounting-planning

jobs:
  build-win:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      ORCA_APP_NAME: contadorca
      ORCA_APP_ID: com.contadorca.app
      ORCA_BACKGROUND_LAUNCH: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/install-mobile-dependencies

      - name: Build app
        run: pnpm build:release

      - name: Package Windows installer
        run: pnpm build:windows-local

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: contadorca-windows-installer
          path: |
            out/**/*.exe
            dist/**/*.exe
          if-no-files-found: warn
